# GitLab CI — decimalx（特性 034：中央模板接入）
# fmt/clippy/test/doc 由 xhyperium/workspace 模板 governance-v1.0.3 提供；
# 其余 job 保留本仓自有定义。模板版本 pin tag，升级走 MR 改 ref。
include:
  - project: "xhyperium/workspace"
    ref: "governance-v1.0.4"
    file:
      - "/.gitlab/ci/templates/governance.yml"
      - "/.gitlab/ci/templates/rust.yml"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api"'

variables:
  CARGO_TERM_COLOR: always
  MSRV: "1.88"

.rust:
  image: rust:1.88
  tags: [docker]
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/

msrv:
  extends: .rust
  stage: test
  script:
    - if [ "$MSRV" != "1.88" ]; then rustup toolchain install "$MSRV" --profile minimal; fi
    - cargo +"$MSRV" check --all-features

decimalx-prod-live:
  extends: .rust
  stage: test
  variables:
    DECIMALX_LIVE_PROFILE: "production"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - decimalx-live-receipt.json
  script:
    - curl -fsSLO https://nodejs.org/dist/v22.23.5/node-v22.23.5-linux-x64.tar.xz
    - tar -xJf node-v22.23.5-linux-x64.tar.xz -C /usr/local --strip-components=1
    - rm -f node-v22.23.5-linux-x64.tar.xz
    - |
      node scripts/prod-live-receipt.mjs
      test -s decimalx-live-receipt.json
      grep -q '"trust_level": "E1"' decimalx-live-receipt.json
      grep -q '"commit_sha"' decimalx-live-receipt.json
      grep -q "${CI_COMMIT_SHA}" decimalx-live-receipt.json
      cargo run --example decimalx_basic | tee /tmp/decimalx-live.out
      grep -q 'decimalx-consumer: ok' /tmp/decimalx-live.out
      grep -q 'profile=production' /tmp/decimalx-live.out
